<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast — GTA 6 Cover Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="star">★</span> NEON COAST <span class="sub">Cover Studio</span></div>
  <div class="top-actions">
    <select id="preset-select" title="Presets"></select>
    <button id="shuffle-btn" title="Shuffle layout, grade and seed">Shuffle</button>
    <button id="undo-btn" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo-btn" title="Redo (Ctrl+Y)">Redo</button>
  </div>
</header>
<div class="workspace">
  <aside class="sidebar">
    <section class="group">
      <h2>Photos</h2>
      <div id="photo-list" class="thumbs"></div>
      <label class="upload-btn">Upload photos (up to 4)
        <input id="upload" type="file" accept="image/*" multiple hidden>
      </label>
      <p class="hint">Click a panel on the cover, then a photo to put it there. Drag a panel to pan, scroll to zoom.</p>
    </section>
    <section class="group">
      <h2>Layout</h2>
      <div id="layout-list" class="picks"></div>
    </section>
    <section class="group">
      <h2>Grade</h2>
      <div id="grade-list" class="picks"></div>
    </section>
    <section class="group">
      <h2>Caption</h2>
      <label>Title <input id="title-input" maxlength="24" value="NEON SHORE"></label>
      <label>Subtitle <input id="subtitle-input" maxlength="40" value="VICE CITY • 2026"></label>
      <div id="title-colors" class="swatches"></div>
      <label class="check"><input id="badge-toggle" type="checkbox" checked> Gold “NEON COAST” badge</label>
    </section>
    <section class="group">
      <h2>Selected panel</h2>
      <p id="panel-label" class="hint">No panel selected</p>
      <label>Zoom <input id="zoom-range" type="range" min="1" max="4" step="0.05" value="1"></label>
      <button id="fit-btn">Fit (face anchor)</button>
    </section>
    <section class="group">
      <h2>Export</h2>
      <div id="export-list" class="picks"></div>
      <button id="export-one">Export this size as PNG</button>
      <button id="export-all">Export all three sizes</button>
    </section>
  </aside>
  <main class="stage-wrap">
    <canvas id="stage" width="1080" height="1080"></canvas>
    <p id="size-label" class="size-label"></p>
  </main>
</div>
<script type="module" src="src/main.js"></script>
<script type="module" src="src/shots.js"></script>
</body>
</html>
